<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chapter 11</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">

    <link rel="stylesheet" href="styles.css" />

    <!--The React JS libraries -->
    <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <!--Initially, we will use the babel run-time library to convert JSX in the browser -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>   
    
    <script src="movie-data.js"></script>
    
<script type="text/babel">

/* 
------------------------------------------------------------------------------------------------------------------
*/
class App extends React.Component {

    //constructor for props
    constructor(props) {
        super(props);
        this.state = {
            movies: movieData
        };
    }

    //update the saveChanges to update the movie data in the state
    saveChanges = (index, movie) => {
        const movies = [...this.state.movies];
        //update the movie data in the state
        movies[index] = movie;
        //update the state with the new movie data
        this.setState({ movies: movies });
    }

    render() {  
        return (
            <main className="container">
                <section className="columns has-background-light">
                {/* update the MovieList to pass the movies from the state*/}
                <MovieList movies={ this.state.movies }/>
                <div className="column is-half">
                    {/* update the MovieForm to pass the movies from the state and the saveChanges function*/}
                    {/* use the map function to create a list of the movies passed in the state*/}
                    { this.state.movies.map( (m, index) =>
                        <MovieForm movie={m} index={index} key={m.id} saveChanges={this.saveChanges} />
                    ) }
                </div>
                </section>
            </main>                
        );
    }

}


/* 
------------------------------------------------------------------------------------------------------------------
*/
class MovieForm extends React.Component {

    //handle change event to update the movie data in the state
    handleChange = (e) => {
        //update the movie data in the state
        const updatedMovie = { ...this.props.movie, [e.target.name]: e.target.value };
        //call the saveChanges function to update the movie data in the state
        this.props.saveChanges(this.props.index, updatedMovie);
    }

    render() {
        //grab the movie from the props
        const movie = this.props.movie;
        return (
            <form className="panel has-background-grey-lighter"  >

                <div className="field is-horizontal">
                    <div className="field-label is-normal">
                        <label className="label">Title</label>
                    </div>
                    <div className="field-body">
                        <input className="input" type="text" name="title"
                            //update the value and onChange to the title of the movie passed in the props
                            value={ movie.title } onChange={ this.handleChange } />   
                    </div>
                </div>   

                <div className="field is-horizontal">
                    <div className="field-label is-normal">
                        <label className="label">Tagline</label>
                    </div>
                    <div className="field-body">
                        <textarea className="textarea" rows="2"  name="tagline"
                            //update the value and onChange to the tagline of the movie passed in the props
                            value={ movie.tagline } onChange={ this.handleChange }></textarea>
                    </div>
                </div>                  

                <div className="field is-horizontal">
                    <div className="field-label is-normal">
                        <label className="label">Runtime</label>
                    </div>
                    <div className="field-body">
                        <input className="input" type="text" name="runtime"
                            //update the value and onChange to the runtime of the movie passed in the props
                            value={ movie.runtime } onChange={ this.handleChange }/>   
                    </div>
                </div>    
                                                  
            </form>
        );
    }
}

/* 
------------------------------------------------------------------------------------------------------------------
*/
class MovieList extends React.Component {


render() {
    return (
        <div className="column is-half">
            <ul className="columns is-multiline">
                {/* update the SingleMovie to create a list of the movies passed in the props using the map function*/}
                { this.props.movies.map( m => <SingleMovie movie={m} key={m.id} /> ) }
            </ul>   
        </div>   
    );
  }

}

/* 
------------------------------------------------------------------------------------------------------------------
*/
class SingleMovie extends React.Component {


render() {
    //grab the movie from the props
    const movie = this.props.movie;
    return (
        <li className="column is-one-third-desktop is-half-tablet"  >
            <div className="card">
                <div className="card-image">
                <figure className="image is-2by3">
                    {/* update the image src to the tmdb poster  and the alt to the title of the movie passed in the props*/}
                    <img src={ "https://image.tmdb.org/t/p/w185" + movie.poster }  alt={ movie.title } />
                </figure>
                </div>
                <div className="card-content has-text-centered content-rectangle">
                    {/* update the title and runtime to the values passed in the props*/}
                    <h2 className="title is-6">{ movie.title } ({ movie.runtime } min)</h2>
                    {/* update the tagline to the value passed in the props*/}
                    <p className="is-size-7">{ movie.tagline }</p>
                </div>    
                <footer className="card-footer">
                    {/* update the MovieLink to get the correct tmdbID*/}
                    <MovieLink tmdbID={ movie.tmdbID } />
                </footer>                                      
            </div>                
        </li>
    )

}

}


/* 
------------------------------------------------------------------------------------------------------------------
*/
const MovieLink = props => {
    //update the props to the tmdbID not just id
  return (
        <a className="button card-footer-item" 
            href={ "https://www.themoviedb.org/movie/" + props.tmdbID } >

                <img src="images/tmdb.svg" width="30" />
        </a>    
    );
};
    
ReactDOM.render(<App />, document.querySelector('#react-container')); 
  
</script> 
        
        
  </head>
  <body>
    <div id='react-container' ></div>
  </body>
</html>
